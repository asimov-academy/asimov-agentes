[project]
name = "asimov-agentes"
version = "0.1.0"
description = "Plataforma de agentes de atendimento instalada pelo setup Asimov Academy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pydantic-ai-slim[duckduckgo]>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "cryptography>=43",
    "pypdf>=6.19.0",
    "tinytag>=2.3.2",
    # Painel do operador no navegador: páginas e formulários. Nada de framework de front.
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Base de conhecimento: o vetor no Postgres e a leitura de .docx. O PDF já era do pypdf.
    "pgvector>=0.5.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# Só o contêiner do copiloto instala o SDK do MCP: é ele que serve as ferramentas ao CLI. A API e
# o worker de atendimento seguem sem isso na imagem.
copiloto = ["mcp>=2.2"]
openai = ["pydantic-ai-slim[openai]>=1.0"]
anthropic = ["pydantic-ai-slim[anthropic]>=1.0"]
gemini = ["pydantic-ai-slim[google]>=1.0"]
groq = ["pydantic-ai-slim[groq]>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["testes"]
