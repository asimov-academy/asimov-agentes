<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Primeiro acesso · Asimov Agentes</title>
<link rel="stylesheet" href="painel.css">
</head>
<body>
<main class="entrar">
  <div class="marca" style="justify-content:center;margin-bottom:22px">
    <span class="ponto">A</span>
    <span>Asimov Agentes<small>primeiro acesso</small></span>
  </div>

  <div class="carta">
    <h2>Código do terminal</h2>
    <p class="rotulo" style="margin-top:-6px;margin-bottom:16px">
      Rode <span class="mono">asimov painel</span> na VPS. Ele mostra um código de uso único,
      válido por 15 minutos.
    </p>
    <form id="form">
      <div class="campo">
        <label for="codigo">Código</label>
        <input type="text" id="codigo" class="mono" placeholder="XXXX-XXXX" autocomplete="off" autofocus>
      </div>
      <div class="campo">
        <label for="senha">Senha que você vai usar
          <span class="dica">Mínimo de 12 caracteres. Guarde num gerenciador: não há recuperação por e-mail.</span>
        </label>
        <input type="password" id="senha" autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="senha2">Repita a senha</label>
        <input type="password" id="senha2" autocomplete="new-password">
      </div>
      <div class="campo">
        <button class="botao forte" style="width:100%" type="submit">Criar acesso e entrar</button>
      </div>
    </form>
  </div>

  <p class="rotulo" style="text-align:center;margin-top:18px">
    <a href="index.html">Já tenho senha</a>
  </p>
</main>

<script src="dados.js"></script>
<script src="painel.js"></script>
<script>
  // POST /painel/primeiro-acesso (código de uso único no Redis, cria UsuarioPainel)
  $("#form").addEventListener("submit", (e) => {
    e.preventDefault();
    location.href = "assistente.html";
  });
</script>
</body>
</html>
