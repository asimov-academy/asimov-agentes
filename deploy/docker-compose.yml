# Sempre chamado pela raiz do projeto com:
#   docker compose --project-name asimov --env-file .env -f deploy/docker-compose.yml ...
# (setup/instalar.sh e deploy/publicar.sh já fazem isso)

x-backend: &backend
  build:
    context: ../backend
    target: producao
    args:
      PROVEDORES: ${PROVEDORES}
  image: asimov-backend:local
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    DIRETORIO_PROMPTS: /app/prompts
    DIRETORIO_MODELOS: /app/modelos
  volumes:
    - ../prompts:/app/prompts
    - ../modelos:/app/modelos:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: ["arq", "app.worker.Configuracao"]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SUBDOMINIO_BOT: ${SUBDOMINIO_BOT}
      EMAIL_SSL: ${EMAIL_SSL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  teste:
    profiles: ["teste"]
    build:
      context: ../backend
      target: teste
    image: asimov-backend:teste
    environment:
      TESTE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/asimov_teste
      TESTE_REDIS_URL: redis://redis:6379/15
      TESTE_DIRETORIO_MODELOS: /app/modelos
    volumes:
      - ../modelos:/app/modelos:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres:
  redis:
  caddy_data:
  caddy_config:
